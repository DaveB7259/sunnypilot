name: Build Release (C4)

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            zip \
            unzip \
            rsync \
            jq

      - name: Set up Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Build sunnypilot (C4)
        run: |
          set -e
          echo "Starting sunnypilot build..."
          python3 system/manager/build.py

      - name: Find release artifact
        id: find_artifact
        run: |
          FILE=$(find . -type f -name "*.tar.xz" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No .tar.xz file found!"
            exit 1
          fi
          echo "artifact=$FILE" >> $GITHUB_OUTPUT

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunnypilot-c4-release
          path: ${{ steps.find_artifact.outputs.artifact }}
